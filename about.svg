<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" fill="none">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="796" height="336" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Header Title -->
  <text x="32" y="42" fill="#F8FAFC" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">About Me</text>
  <rect x="32" y="52" width="736" height="1" fill="#1E293B"/>

  <!-- Bio Text -->
  <text x="32" y="80" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    <tspan x="32" dy="0">Hi, I'm <tspan fill="#60A5FA" font-weight="600">Areeba</tspan> — a final-year BS AI student at Air University Islamabad, dedicated to building end-to-end, full-stack AI products</tspan>
    <tspan x="32" dy="20">and automating core business workflows. I transform complex ideas into operational software that replaces manual overhead.</tspan>
    <tspan x="32" dy="20">Backed by two R&amp;D internships at NASTP (National Aerospace Science &amp; Technology Park), I bridge the gap between technical AI engineering</tspan>
    <tspan x="32" dy="20">and enterprise execution — shipping functional MVPs, custom RAG systems, and autonomous agentic workflows.</tspan>
  </text>

  <!-- Table Container -->
  <g transform="translate(32, 170)">
    <!-- Table Grid Lines -->
    <rect x="0" y="0" width="736" height="140" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="180" y1="0" x2="180" y2="140" stroke="#1E293B" stroke-width="1.5"/>
    
    <line x1="0" y1="28" x2="736" y2="28" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="56" x2="736" y2="56" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="84" x2="736" y2="84" stroke="#1E293B" stroke-width="1"/>
    <line x1="0" y1="112" x2="736" y2="112" stroke="#1E293B" stroke-width="1"/>

    <!-- Table Rows Header Labels -->
    <text x="16" y="19" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">Target Role</text>
    <text x="16" y="47" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">Core Mission</text>
    <text x="16" y="75" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">Technical Focus</text>
    <text x="16" y="103" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">Full-Stack AI Stack</text>
    <text x="16" y="131" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">Looking for</text>

    <!-- Table Rows Data Values -->
    <text x="196" y="19" fill="#60A5FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">AI Solutions Engineer · Forward-Deployed AI Architect</text>
    <text x="196" y="47" fill="#F8FAFC" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Enterprise Business Automation · Streamlining Workflows with AI</text>
    <text x="196" y="75" fill="#F8FAFC" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Full-Stack AI Apps · RAG Pipelines · Autonomous LLM Agents · MCP</text>
    <text x="196" y="103" fill="#F8FAFC" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">React 19 · TanStack · Supabase · Python · LangChain · Gemini API</text>
    <text x="196" y="131" fill="#F8FAFC" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">AI Engineering Opportunities, Business Automation &amp; Launch Projects</text>
  </g>
</svg>
