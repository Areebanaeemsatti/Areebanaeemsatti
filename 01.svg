<svg xmlns="http://www.w3.org/2000/svg" width="500" height="220" viewBox="0 0 500 220" fill="none">
  <rect x="2" y="2" width="496" height="216" rx="16" fill="#0B0F17" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- Content Left -->
  <text x="24" y="44" fill="#3B82F6" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Medical Tumor Detection</text>
  <text x="24" y="74" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">YOLOv8 &amp; OpenCV object detection pipeline</text>
  <text x="24" y="92" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">for localization and classification of tumors in</text>
  <text x="24" y="110" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">medical imaging datasets.</text>
  
  <!-- Badges -->
  <rect x="24" y="152" width="65" height="26" rx="6" fill="#1E293B"/>
  <text x="56" y="169" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Python</text>
  
  <rect x="97" y="152" width="68" height="26" rx="6" fill="#1E293B"/>
  <text x="131" y="169" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">YOLOv8</text>
  
  <rect x="173" y="152" width="68" height="26" rx="6" fill="#1E293B"/>
  <text x="207" y="169" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">OpenCV</text>

  <!-- Illustration Right (Brain scan / Tumor) -->
  <g transform="translate(360, 40)">
    <path d="M 50 10 C 20 10, 10 40, 10 70 C 10 100, 30 130, 50 130 C 70 130, 90 100, 90 70 C 90 40, 80 10, 50 10 Z" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M 50 10 L 50 130" fill="none" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="65" cy="55" r="10" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="65" cy="55" r="16" fill="none" stroke="#EF4444" stroke-width="1" stroke-dasharray="2 2"/>
