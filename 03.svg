<svg xmlns="http://www.w3.org/2000/svg" width="500" height="220" viewBox="0 0 500 220" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="girlyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Card Border & Background -->
  <rect x="2" y="2" width="496" height="216" rx="16" fill="#0B0F17" stroke="#EC4899" stroke-width="2"/>

  <!-- Content Left -->
  <text x="24" y="42" fill="#F472B6" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">💖 Glow Quest AI</text>
  <text x="24" y="72" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">Your Personal AI Wellness &amp; Glow-Up Coach.</text>
  <text x="24" y="90" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">Personalized skincare, fitness, habit tracking, and</text>
  <text x="24" y="108" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">nutrition routines mapped to your lifestyle &amp; skin type.</text>

  <!-- Badges -->
  <rect x="24" y="152" width="82" height="26" rx="6" fill="#1E293B"/>
  <text x="65" y="169" fill="#F472B6" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">✨ AI Skincare</text>

  <rect x="114" y="152" width="88" height="26" rx="6" fill="#1E293B"/>
  <text x="158" y="169" fill="#F472B6" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">🧘‍♀️ Wellness</text>

  <rect x="210" y="152" width="85" height="26" rx="6" fill="#1E293B"/>
  <text x="252" y="169" fill="#F472B6" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">🎀 Habit Tracker</text>

  <!-- Girly Skincare & Glow Illustration Right -->
  <g transform="translate(365, 30)">
    <!-- Glowing Wellness Ring -->
    <circle cx="50" cy="65" r="42" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="50" cy="65" r="42" fill="none" stroke="#EC4899" stroke-width="3" stroke-dasharray="180 90"/>

    <!-- Skincare Bottle / Dropper Icon -->
    <rect x="38" y="45" width="24" height="40" rx="6" fill="#1E1B4B" stroke="#F472B6" stroke-width="2"/>
    <rect x="44" y="37" width="12" height="8" rx="2" fill="#F472B6"/>
    <path d="M 47 30 Q 50 25, 53 30 Z" fill="#F472B6"/>
    <!-- Label Heart -->
    <path d="M 50 63 C 48 60, 43 60, 43 63 C 43 66, 50 71, 50 71 C 50 71, 57 66, 57 63 C 57 60, 52 60, 50 63 Z" fill="#EC4899"/>

    <!-- Large Sparkles ✨ -->
    <path d="M 18 35 L 21 48 L 34 51 L 21 54 L 18 67 L 15 54 L 2 51 L 15 48 Z" fill="#F472B6"/>
    <path d="M 78 25 L 80 32 L 87 34 L 80 36 L 78 43 L 76 36 L 69 34 L 76 32 Z" fill="#FB7185"/>
    <path d="M 75 85 L 76 90 L 81 91 L 76 92 L 75 97 L 74 92 L 69 91 L 74 90 Z" fill="#F472B6" fill-opacity="0.8"/>
