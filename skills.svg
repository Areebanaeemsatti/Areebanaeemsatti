<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="796" height="456" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="42" fill="#F8FAFC" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">📊 Skills Proficiency</text>
  <rect x="32" y="52" width="736" height="1" fill="#1E293B"/>

  <!-- Bars Container -->
  <g transform="translate(32, 72)" font-family="'Segoe UI', Roboto, sans-serif">
    
    <!-- Row 1: Python & Full-Stack AI (92%) -->
    <text x="0" y="18" fill="#E2E8F0" font-size="13" font-weight="500">Python &amp; Full-Stack AI</text>
    <rect x="210" y="5" width="450" height="16" rx="8" fill="#1E293B"/>
    <rect x="210" y="5" width="414" height="16" rx="8" fill="url(#barGrad)"/>
    <text x="672" y="18" fill="#60A5FA" font-size="13" font-weight="600">92%</text>

    <!-- Row 2: Machine Learning & DL (90%) -->
    <text x="0" y="50" fill="#E2E8F0" font-size="13" font-weight="500">Machine Learning &amp; DL</text>
    <rect x="210" y="37" width="450" height="16" rx="8" fill="#1E293B"/>
    <rect x="210" y="37" width="405" height="16" rx="8" fill="url(#barGrad)"/>
    <text x="672" y="50" fill="#60A5FA" font-size="13" font-weight="600">90%</text>

    <!-- Row 3: Business Automation (88%) -->
    <text x="0" y="82" fill="#E2E8F0" font-size="13" font-weight="500">Business Process Automation</text>
    <rect x="210" y="69" width="450" height="16" rx="8" fill="#1E293B"/>
    <rect x="210" y="69" width="396" height="16" rx="8" fill="url(#barGrad)"/>
    <text x="672" y="82" fill="#60A5FA" font-size="13" font-weight="600">88%</text>

    <!-- Row 4: Agentic Workflows & RAG (85%) -->
    <text x="0" y="114" fill="#E2E8F0" font-size="13" font-weight="500">Agentic Workflows &amp; RAG</text>
    <rect x="210" y="101" width="450" height="16" rx="8" fill="#1E293B"/>
    <rect x="210" y="101" width="382.5" height="16" rx="8" fill="url(#barGrad)"/>
    <text x="672" y="114" fill="#60A5FA" font-size="13" font-weight="600">85%</text>

    <!-- Row 5: Computer Vision & NLP (82%) -->
    <text x="0" y="146" fill="#E2E8F0" font-size="13" font-weight="500">Computer Vision &amp; NLP</text>
    <rect x="210" y="133" width="450" height="16" rx="8" fill="#1E293B"/>
    <rect x="210" y="133" width="369" height="16" rx="8" fill="url(#barGrad)"/>
    <text x="672" y="146" fill="#60A5FA" font-size="13" font-weight="600">82%</text>

    <!-- Row 6: Data Viz & Storytelling (80%) -->
    <text x="0" y="178" fill="#E2E8F0" font-size="13" font-weight="500">Data Viz &amp; Storytelling</text>
    <rect x="210" y="165" width="450" height="16" rx="8" fill="#1E293B"/>
    <rect x="210" y="165" width="360" height="16" rx="8" fill="url(#barGrad)"/>
    <text x="672" y="178" fill="#60A5FA" font-size="13" font-weight="600">80%</text>

    <!-- Row 7: Knowledge Graphs & Neo4j (78%) -->
    <text x="0" y="210" fill="#E2E8F0" font-size="13" font-weight="500">Knowledge Graphs (Neo4j)</text>
    <rect x="210" y="197" width="450" height="16" rx="8" fill="#1E293B"/>
    <rect x="210" y="197" width="351" height="16" rx="8" fill="url(#barGrad)"/>
    <text x="672" y="210" fill="#60A5FA" font-size="13" font-weight="600">78%</text>

    <!-- Row 8: Web Stack (React/TanStack/Supabase) (76%) -->
    <text x="0" y="242" fill="#E2E8F0" font-size="13" font-weight="500">Full-Stack Web (React/Supabase)</text>
    <rect x="210" y="229" width="450" height="16" rx="8" fill="#1E293B"/>
    <rect x="210" y="229" width="342" height="16" rx="8" fill="url(#barGrad)"/>
    <text x="672" y="242" fill="#60A5FA" font-size="13" font-weight="600">76%</text>

    <!-- Row 9: MLOps & Deployment (72%) -->
    <text x="0" y="274" fill="#E2E8F0" font-size="13" font-weight="500">MLOps &amp; Deployment</text>
    <rect x="210" y="261" width="450" height="16" rx="8" fill="#1E293B"/>
    <rect x="210" y="261" width="324" height="16" rx="8" fill="url(#barGrad)"/>
    <text x="672" y="274" fill="#60A5FA" font-size="13" font-weight="600">72%</text>

    <!-- Row 10: Model Context Protocol (MCP) (70%) -->
    <text x="0" y="306" fill="#E2E8F0" font-size="13" font-weight="500">MCP &amp; Agent Integration</text>
    <rect x="210" y="293" width="450" height="16" rx="8" fill="#1E293B"/>
    <rect x="210" y="293" width="315" height="16" rx="8" fill="url(#barGrad)"/>
    <text x="672" y="306" fill="#60A5FA" font-size="13" font-weight="600">70%</text>

  </g>
</svg>
