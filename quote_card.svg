  <!-- Main Quote Content -->
  <g transform="translate(40, 70)" font-family="'Fira Code', 'Segoe UI', monospace">
    <text x="0" y="20" fill="#00F5D4" font-size="20" font-weight="700">&gt; <tspan fill="#F8FAFC">"Building AI that </tspan><tspan fill="#00F5D4">helps</tspan><tspan fill="#F8FAFC">, not just </tspan><tspan fill="#F72585">impresses</tspan><tspan fill="#F8FAFC">."</tspan></text>
    <text x="24" y="55" fill="#64748B" font-size="13" font-weight="500">// Driven by real-world impact &amp; intelligent automation</text>
  </g>
