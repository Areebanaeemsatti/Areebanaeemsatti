<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" fill="none">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="796" height="176" rx="12" fill="url(#cyberBg)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Top Terminal Header Bar -->
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 786 2 C 792.63 2 798 7.37 798 14 L 798 34 L 2 34 Z" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
  <circle cx="24" cy="18" r="5" fill="#FF5F56"/>
  <circle cx="40" cy="18" r="5" fill="#FFBD2E"/>
  <circle cx="56" cy="18" r="5" fill="#27C93F"/>
  <text x="80" y="22" fill="#64748B" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600">philosophy.config.ts</text>

  <!-- Bottom Accent Gradient Line -->
