<svg xmlns="http://www.w3.org/2000/svg" width="500" height="220" viewBox="0 0 500 220" fill="none">
  <rect x="2" y="2" width="496" height="216" rx="16" fill="#0B0F17" stroke="#8B5CF6" stroke-width="2"/>
  
  <!-- Content Left -->
  <text x="24" y="44" fill="#A855F7" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">GitHub Recommender Engine</text>
  <text x="24" y="74" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">Knowledge-graph recommendation system mapping</text>
  <text x="24" y="92" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">repository connections using LLM agents and semantic</text>
  <text x="24" y="110" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">routing via Neo4j &amp; LangChain.</text>
  
  <!-- Badges -->
  <rect x="24" y="152" width="58" height="26" rx="6" fill="#1E293B"/>
  <text x="53" y="169" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Neo4j</text>
  
  <rect x="90" y="152" width="82" height="26" rx="6" fill="#1E293B"/>
  <text x="131" y="169" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">LangChain</text>
  
  <rect x="180" y="152" width="52" height="26" rx="6" fill="#1E293B"/>
  <text x="206" y="169" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">LLMs</text>

  <!-- Illustration Right (Network Nodes) -->
  <g transform="translate(360, 45)">
    <line x1="50" y1="20" x2="20" y2="90" stroke="#6D28D9" stroke-width="2"/>
    <line x1="50" y1="20" x2="80" y2="90" stroke="#6D28D9" stroke-width="2"/>
    <line x1="20" y1="90" x2="80" y2="90" stroke="#6D28D9" stroke-width="2"/>
    
    <circle cx="50" cy="20" r="8" fill="#A855F7"/>
    <circle cx="20" cy="90" r="8" fill="#3B82F6"/>
    <circle cx="80" cy="90" r="8" fill="#3B82F6"/>
    
    <text x="50" y="5" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Graph</text>
    <text x="10" y="110" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Repos</text>
    <text x="90" y="110" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Users</text>
  </g>
</svg>
